# Development only. VOGON ships as a Claude Code plugin from src/vogon, and its
# version is in src/vogon/.claude-plugin/plugin.json. This project is never
# built or installed; it holds the dev dependencies.

[project]
name = "vogon-dev"
dynamic = ["version"]
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
