site_name: VOGON
site_description: Because good enough is not compliant.
site_url: https://example.github.io/vogon/

docs_dir: src/docs
site_dir: docs

# /user/install.html, not /user/install/. Keeps URLs file-shaped.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
  features:
    - navigation.sections
    - content.code.copy

nav:
  - User guide:
      - user/index.md
      - Installation: user/install.md
      - CLI: user/cli.md
  - Developer guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Contributing: dev/contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
