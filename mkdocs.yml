site_name: VOGON
site_description: Requirements, traceability and validation evidence for GxP software.
site_url: https://example.github.io/vogon/

docs_dir: src/docs
site_dir: docs

# /user/install.html, not /user/install/. Keeps URLs file-shaped.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
  features:
    - navigation.sections
    - content.code.copy

nav:
  - User guide:
      - user/index.md
      - Installation: user/install.md
      - Scripts: user/scripts.md
  - Developer guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - The loop: dev/loop.md
      - Vocabulary: dev/vocabulary.md
      - Records: dev/records.md
      - Sources: dev/sources.md
      - Writing standard: dev/writing.md
      - Development process:
          - dev/process/index.md
          - Steps of the GxP process: dev/process/steps.md
          - Setting up a project: dev/process/setup.md
          - When a check fails: dev/process/failed_checks.md
          - From meetings to requirements: dev/process/meetings.md
          - Checking the new requirements: dev/process/new_requirements.md
          - What to work on next: dev/process/next_work.md
          - Planning one requirement: dev/process/planning.md
          - Test cases, code and tests: dev/process/implementation.md
          - Checking the tests: dev/process/test_checks.md
          - Compliance documents: dev/process/documents.md
      - Marketing page: dev/site.md
      - Contributing: dev/contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
