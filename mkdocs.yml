site_name: VOGON
site_description: Requirements, traceability and validation evidence for GxP software.
site_url: https://example.github.io/vogon/

docs_dir: src/docs
site_dir: docs

# /user/install.html, not /user/install/. Keeps URLs file-shaped.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
  features:
    - navigation.sections
    - content.code.copy

nav:
  - User guide:
      - user/index.md
      - Installation: user/install.md
  - Developer guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - The loop: dev/loop.md
      - Vocabulary: dev/vocabulary.md
      - Records: dev/records.md
      - Sources: dev/sources.md
      - Development process:
          - dev/process/index.md
          - Setting up a project: dev/process/setup.md
          - Requirements from sources: dev/process/requirements.md
          - Approving requirements: dev/process/approval.md
          - Test procedures: dev/process/test_procedures.md
          - Planning: dev/process/planning.md
          - Code, tests and documentation: dev/process/implementation.md
          - Release documents: dev/process/documents.md
      - Marketing page: dev/site.md
      - Contributing: dev/contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
