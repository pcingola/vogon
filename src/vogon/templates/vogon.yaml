# VOGON configuration for this project: vogon/project/vogon.yaml
#
# vogon:init writes this file from this template. It holds configuration
# only. How the project works comes from its validation plan, through the
# process files in vogon/project/*.md.

# The system that fills each role, by product name. Each role is optional:
# omit a role the project does not have.
systems:
  repository_host: <product>
  # tracker: <product>
  # test_manager: <product>      # omit where there is none: vogon trace builds the matrix
  # document_system: <product>   # omit where there is none: documents stay in the repository
  # meetings: <product>
  # mail: <product>
  # chat: <product>

# The holders of each approval role, under the plan's role names, as git
# identities "Name <email>". vogon/project/requirements.md "Approval" names
# the requirement approver. When that section names no role, the requirement
# approver is product_owner.
roles:
  product_owner:
    - Alice Smith <alice@example.com>
  # test_lead:
  #   - Bob Jones <bob@example.com>
  # platform_lead:
  #   - Carol White <carol@example.com>

# The modules of the system, in uppercase letters and digits. A record may
# name only a listed module. A project without modules omits the key.
modules:
  - PRN
